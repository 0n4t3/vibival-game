# Vibival flatpak. Build with: tools/build-flatpak.sh
#
# Sandbox: Wayland only (no X11 or fallback-x11), GPU, PulseAudio, gamepads.
# No network, no host or home filesystem access. Settings and resource packs
# live in the app's private data dir: ~/.var/app/top.dns7.vibival/data/vibival
id: top.dns7.vibival
base: org.godotengine.godot.BaseApp
base-version: '4.7'
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: vibival

finish-args:
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --device=input

modules:
  - name: vibival
    buildsystem: simple
    build-commands:
      - python3 tools/pack.py game vibival.zip
      - install -Dm644 vibival.zip /app/share/vibival/vibival.zip
      - install -Dm755 flatpak/vibival.sh /app/bin/vibival
      - install -Dm644 flatpak/top.dns7.vibival.desktop -t /app/share/applications
      - install -Dm644 flatpak/top.dns7.vibival.metainfo.xml -t /app/share/metainfo
      - install -Dm644 flatpak/top.dns7.vibival.svg -t /app/share/icons/hicolor/scalable/apps
      - install -Dm644 LICENSE -t /app/share/licenses/top.dns7.vibival
    sources:
      - type: dir
        path: ../game
        dest: game
        skip:
          - tests
      - type: dir
        path: ../tools
        dest: tools
      - type: dir
        path: .
        dest: flatpak
      - type: file
        path: ../LICENSE
